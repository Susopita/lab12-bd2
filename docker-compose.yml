version: '3.8'

services:
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: lab12-pgadmin4
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@example.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "8012:80"
    networks:
      - lab12-net
      
  db1:
    image: postgres:15-alpine
    container_name: lab12-postgres-1
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5437:5432"
    networks:
      - lab12-net
    volumes:
      - datos_pg1:/var/lib/postgresql/data
      
  db2:
    image: postgres:15-alpine
    container_name: lab12-postgres-2
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    ports:
      - "5438:5432"
    networks:
      - lab12-net
    volumes:
      - datos_pg2:/var/lib/postgresql/data

volumes:
  datos_pg1:
  datos_pg2:

networks:
  lab12-net:
    driver: bridge
